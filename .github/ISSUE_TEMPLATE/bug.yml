name: Bug report
description: Report a reproducible failure in a script or skill.
title: "[Bug] "
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 or Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.22.3
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Claude.ai
        - Codex
        - Terminal
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and steps
      description: Include the exact command, inputs, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error
      description: Remove credentials and private file paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: validate
    attributes:
      label: Project validation output
      description: Paste the output from project.cjs validate or explain why it does not apply.
      render: json
    validations:
      required: true
